<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 SBD Girly Store</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff5f7;
    --surface: #ffffff;
    --surface2: #fff0f3;
    --border: #ffcad4;
    --accent: #ff8fa3; /* Hot pink pop */
    --accent2: #ffb3c1; /* Soft pink */
    --text: #5e3038;
    --muted: #a38087;
    --error: #ff4d6d;
    --success: #7bf1a8;
    --font-display: 'Fredoka', sans-serif;
    --font-body: 'Quicksand', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  /* ── Heart/Polka dot background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(var(--accent2) 1px, transparent 1px);
    background-size: 30px 30px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Pages ── */
  .page { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .page.active { display: flex; }

  /* ── Nav ── */
  nav {
    position: fixed;
    top: 15px; left: 15px; right: 15px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 2rem;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    border: 2px solid var(--border);
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(255, 143, 163, 0.1);
  }

  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 2px 2px 0px #fff;
  }

  .nav-links { display: flex; gap: 0.8rem; align-items: center; }

  .nav-btn {
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.5rem 1.2rem;
    border: 2px solid transparent;
    border-radius: 25px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .nav-btn:hover, .nav-btn.active {
    background: var(--accent2);
    color: white;
    transform: scale(1.05);
  }

  .nav-btn.logout:hover {
    background: var(--error);
  }

  /* ── Auth layout ── */
  .auth-page {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 3px solid var(--border);
    padding: 2.5rem;
    border-radius: 30px;
    position: relative;
    box-shadow: 10px 10px 0px var(--accent2);
    animation: bounceIn 0.6s ease;
  }

  .auth-tag {
    font-family: var(--font-display);
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.5rem;
    text-align: center;
  }

  .auth-title {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.5rem;
    color: var(--accent);
    line-height: 1;
  }

  /* ── Form ── */
  .form-group { margin-bottom: 1rem; }

  label {
    display: block;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--muted);
    margin-left: 10px;
    margin-bottom: 0.3rem;
  }

  input {
    width: 100%;
    padding: 0.8rem 1.2rem;
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.95rem;
    border-radius: 20px;
    outline: none;
    transition: all 0.3s;
  }

  input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 10px rgba(255, 143, 163, 0.2);
  }

  .btn-primary {
    width: 100%;
    padding: 1rem;
    margin-top: 1rem;
    background: var(--accent);
    color: white;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 0px #e67a8e;
    transition: all 0.2s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0px #e67a8e;
    background: #ff7a91;
  }

  .btn-primary:active {
    transform: translateY(2px);
    box-shadow: 0 0px 0px #e67a8e;
  }

  .auth-footer {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
  }

  .auth-footer a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  /* ── Items page ── */
  .items-page { flex-direction: column; padding-top: 6rem; }

  .items-header {
    padding: 2rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .items-title {
    font-family: var(--font-display);
    font-size: 3.5rem;
    color: var(--accent);
    text-shadow: 3px 3px 0px #fff;
  }

  .search-box {
    background: white;
    border: 2px solid var(--border);
    border-radius: 30px;
    padding: 5px 20px;
    display: flex;
    align-items: center;
    width: 300px;
  }

  .search-input { border: none; background: transparent; padding: 10px; width: 100%; }

  /* ── Grid ── */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
    padding: 2rem;
  }

  .item-card {
    background: white;
    border-radius: 25px;
    padding: 1.5rem;
    border: 2px solid var(--border);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .item-card:hover {
    transform: translateY(-10px) rotate(1deg);
    box-shadow: 0 15px 30px rgba(255, 143, 163, 0.2);
  }

  .item-card::before {
    content: '🌸';
    position: absolute;
    top: -10px; right: -10px;
    font-size: 2rem;
    opacity: 0.1;
  }

  .item-name {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .item-price {
    font-family: var(--font-display);
    font-size: 1.2rem;
    color: var(--accent);
    font-weight: 700;
  }

  .item-stock {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 15px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-top: 10px;
  }

  .in-stock { background: #e7fff0; color: #2ecc71; }
  .low-stock { background: #fff4e1; color: #f39c12; }
  .out-stock { background: #ffe7e7; color: #e74c3c; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(200%);
    background: var(--accent);
    color: white;
    padding: 1rem 2rem;
    border-radius: 50px;
    font-weight: 700;
    z-index: 1000;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Animations ── */
  @keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3); }
    50% { opacity: 1; transform: scale(1.05); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 10px; }

</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo">🎀 SBD//girly</div>
  <div class="nav-links" id="navLinks">
    <button class="nav-btn" onclick="showPage('items')">Shop</button>
    <button class="nav-btn" id="nav-login-btn" onclick="showPage('login')">Login</button>
    <button class="nav-btn" id="nav-register-btn" onclick="showPage('register')">Join</button>
    <button class="nav-btn logout" id="nav-logout-btn" style="display:none" onclick="logout()">Bye-bye!</button>
  </div>
</nav>

<!-- ── LOGIN ── -->
<div id="page-login" class="page auth-page active">
  <div class="auth-card">
    <div class="auth-tag">Welcome back, bestie! ✨</div>
    <h1 class="auth-title">Sign In</h1>
    <div id="login-alert" class="alert"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="princess@sparkle.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••••">
    </div>
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">Let's Go! 🎀</button>
    <p class="auth-footer">New here? <a onclick="showPage('register')">Create account</a></p>
  </div>
</div>

<!-- ── REGISTER ── -->
<div id="page-register" class="page auth-page">
  <div class="auth-card">
    <div class="auth-tag">New Member? 🌸</div>
    <h1 class="auth-title">Join Us</h1>
    <div id="register-alert" class="alert"></div>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="reg-name" placeholder="Your Sweet Name">
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="reg-username" placeholder="girly_pop_01">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="hello@world.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Make it secure! ✨">
    </div>
    <button class="btn-primary" id="register-btn" onclick="handleRegister()">Sign Me Up! 🦄</button>
    <p class="auth-footer">Already a member? <a onclick="showPage('login')">Login here</a></p>
  </div>
</div>

<!-- ── ITEMS ── -->
<div id="page-items" class="page items-page">
  <div class="items-header">
    <h1 class="items-title">The Catalog 🍓</h1>
    <p id="items-count">Loading the cuteness...</p>
    <div class="search-box">
      <input class="search-input" type="text" id="search-input" placeholder="Search for treats..." oninput="filterItems()">
    </div>
  </div>
  <div class="items-grid" id="items-grid"></div>
</div>

<div class="toast" id="toast">✨ Success! ✨</div>

<script>
  // ... (All your original JavaScript logic stays exactly the same)
  // Just make sure the API_BASE is correct!
  const API_BASE = 'http://localhost:3000';
  let token = localStorage.getItem('sbd_token') || null;
  let allItems = [];

  window.addEventListener('DOMContentLoaded', () => {
    showPage('items');
    updateNav('items');
  });

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${name}`).classList.add('active');
    updateNav(name);
    if (name === 'items') loadItems();
  }

  function updateNav(page) {
    const loggedIn = !!token;
    document.getElementById('nav-login-btn').style.display = (loggedIn) ? 'none' : '';
    document.getElementById('nav-register-btn').style.display = (loggedIn) ? 'none' : '';
    document.getElementById('nav-logout-btn').style.display = loggedIn ? '' : 'none';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // --- Auth & Item logic (unchanged from your original) ---
  // [Paste your handleLogin, handleRegister, loadItems, renderItems functions here]
  
  async function loadItems() {
    const grid = document.getElementById('items-grid');
    try {
      const res = await fetch(`${API_BASE}/items`);
      const data = await res.json();
      allItems = data.payload || [];
      renderItems(allItems);
    } catch (err) {
      grid.innerHTML = "<p>Oh no! The server is being shy. 🎀</p>";
    }
  }

  function renderItems(items) {
    const grid = document.getElementById('items-grid');
    document.getElementById('items-count').textContent = `${items.length} items found ✨`;
    grid.innerHTML = items.map(item => {
      const stockClass = item.stock <= 0 ? 'out-stock' : item.stock <= 5 ? 'low-stock' : 'in-stock';
      return `
        <div class="item-card">
          <div class="item-name">${item.name}</div>
          <div class="item-price">Rp ${item.price.toLocaleString()}</div>
          <div class="item-stock ${stockClass}">${item.stock} in stock</div>
        </div>
      `;
    }).join('');
  }

  function logout() {
    token = null;
    localStorage.removeItem('sbd_token');
    showPage('items');
    showToast('See you later, queen! 👋');
  }
</script>
</body>
</html>
