<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syifa Sarah Nuraini 2406368883</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9fa;
    --glass: rgba(255, 255, 255, 0.7);
    --border: rgba(255, 182, 193, 0.4);
    --accent: #ff8fa3;
    --text-main: #2d1b1e;
    --text-muted: #8c7679;
    --nav-font: 'Fredoka', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    overflow-x: hidden;
  }

  /* ── Original Bubbly Nav ── */
  nav {
    position: fixed;
    top: 15px; left: 15px; right: 15px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 2rem;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(15px);
    border: 2px solid var(--border);
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(255, 143, 163, 0.1);
  }

  .nav-logo { font-family: var(--nav-font); font-size: 1.4rem; font-weight: 600; color: var(--accent); }

  .nav-links { display: flex; gap: 0.8rem; }

  .nav-btn {
    font-family: var(--nav-font);
    font-size: 0.85rem;
    padding: 0.5rem 1.2rem;
    border: 2px solid transparent;
    border-radius: 25px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .nav-btn:hover, .nav-btn.active {
    background: var(--accent);
    color: white;
    transform: scale(1.05);
  }

  /* ── Hero & Search (Zeus UI Style) ── */
  .hero { text-align: center; padding: 10rem 10% 4rem; }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    margin-bottom: 1rem;
    background: linear-gradient(to right, #2d1b1e, #ff8fa3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .search-container { max-width: 500px; margin: 0 auto 4rem; position: relative; }
  .search-container input {
    width: 100%; padding: 1rem 1.5rem; border-radius: 100px;
    border: 1px solid var(--border); background: var(--glass);
    backdrop-filter: blur(5px); font-size: 1rem; outline: none; transition: 0.3s;
  }
  .search-container input:focus { border-color: var(--accent); }

  /* ── Items Grid ── */
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; padding: 0 10% 5rem; }
  .item-card {
    background: var(--glass); border: 1px solid var(--border);
    padding: 2.5rem; border-radius: 30px; transition: 0.4s;
  }
  .item-card:hover { transform: translateY(-10px); border-color: var(--accent); background: #fff; }
  .item-card h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 0.5rem; }

  /* ── Pages & Forms ── */
  .page { display: none; min-height: 100vh; }
  .page.active { display: block; }
  .auth-card {
    max-width: 450px; margin: 8rem auto; padding: 3rem;
    background: #fff; border-radius: 35px; border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
  }
  .auth-card h2 { font-family: 'Playfair Display'; font-size: 2.5rem; margin-bottom: 2rem; }
  .auth-card input {
    width: 100%; padding: 1rem; margin-bottom: 1rem;
    border: 1px solid var(--border); border-radius: 15px; font-family: 'Inter';
  }
  .btn-submit {
    width: 100%; padding: 1rem; background: var(--text-main); color: #fff;
    border: none; border-radius: 15px; font-weight: 600; cursor: pointer; margin-top: 1rem;
  }
</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo">🎀 Syifa Sarah Nuraini 2406368883</div>
  <div class="nav-links">
    <button class="nav-btn" onclick="showPage('items')">Shop</button>
    <button class="nav-btn" id="nav-login-btn" onclick="showPage('login')">Login</button>
    <button class="nav-btn" id="nav-register-btn" onclick="showPage('register')">Join</button>
    <button class="nav-btn" id="nav-logout-btn" style="display:none" onclick="logout()">Bye!</button>
  </div>
</nav>

<!-- SHOP PAGE -->
<div id="page-items" class="page active">
  <section class="hero">
    <h1>Create & Sell</h1>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search our collection..." oninput="handleSearch()">
    </div>
  </section>
  <div class="items-grid" id="items-grid"></div>
</div>

<!-- LOGIN PAGE -->
<div id="page-login" class="page">
  <div class="auth-card">
    <h2>Sign In</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button class="btn-submit" onclick="handleLogin()">Enter ✨</button>
  </div>
</div>

<!-- REGISTER PAGE (RESTORED!) -->
<div id="page-register" class="page">
  <div class="auth-card">
    <h2>Join Us</h2>
    <input type="text" id="reg-name" placeholder="Full Name">
    <input type="text" id="reg-username" placeholder="Username">
    <input type="email" id="reg-email" placeholder="Email Address">
    <input type="password" id="reg-password" placeholder="Password">
    <button class="btn-submit" onclick="handleRegister()">Create Account 🌸</button>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:3000';
  let token = localStorage.getItem('sbd_token') || null;
  let allItems = [];

  window.onload = () => {
    loadItems();
    updateNav();
  };

  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${name}`).classList.add('active');
  }

  function updateNav() {
    const loggedIn = !!token;
    document.getElementById('nav-login-btn').style.display = loggedIn ? 'none' : 'block';
    document.getElementById('nav-register-btn').style.display = loggedIn ? 'none' : 'block';
    document.getElementById('nav-logout-btn').style.display = loggedIn ? 'block' : 'none';
  }

  async function loadItems() {
    try {
      const res = await fetch(`${API_BASE}/items`);
      const data = await res.json();
      allItems = data.payload || data;
      renderItems(allItems);
    } catch (err) { console.error("Check your backend!"); }
  }

  function renderItems(items) {
    const grid = document.getElementById('items-grid');
    grid.innerHTML = items.map(item => `
      <div class="item-card">
        <h3>${item.name}</h3>
        <div style="color: #ff8fa3; font-weight:600;">Rp ${Number(item.price).toLocaleString()}</div>
        <div style="font-size:0.8rem; margin-top:1rem; opacity:0.6;">STOCK: ${item.stock}</div>
      </div>
    `).join('');
  }

  function handleSearch() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const filtered = allItems.filter(item => item.name.toLowerCase().includes(query));
    renderItems(filtered);
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const res = await fetch(`${API_BASE}/users/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (res.ok) {
      const data = await res.json();
      token = data.token;
      localStorage.setItem('sbd_token', token);
      updateNav();
      showPage('items');
    } else { alert("Login failed!"); }
  }

  async function handleRegister() {
    const name = document.getElementById('reg-name').value;
    const username = document.getElementById('reg-username').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const res = await fetch(`${API_BASE}/users/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, username, email, password })
    });
    if (res.ok) {
      alert("Welcome to the club! Now please login.");
      showPage('login');
    } else { alert("Registration failed!"); }
  }

  function logout() {
    token = null;
    localStorage.removeItem('sbd_token');
    updateNav();
    showPage('items');
  }
</script>
</body>
</html>
